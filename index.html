<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to the League 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#061018;font-family:Arial,sans-serif;color:#fff}#menu{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#193f5b,#020509 75%);cursor:pointer;text-align:center}.card{width:min(820px,88vw);padding:50px 30px;border:1px solid #ffffff22;border-radius:26px;background:#07111df5;box-shadow:0 30px 100px #000}.k{letter-spacing:7px;color:#45d9ff;font-weight:900}.t{font-size:clamp(55px,10vw,105px);line-height:.82;font-weight:1000;margin:14px 0}.t span{color:#45d9ff}.tap{display:inline-block;margin-top:18px;padding:18px 30px;border:2px solid #45d9ff;border-radius:14px;color:#45d9ff;font-weight:1000;letter-spacing:2px;animation:p 1.2s infinite}@keyframes p{50%{transform:scale(1.04);box-shadow:0 0 45px #45d9ff55}}#hud{position:fixed;z-index:20;top:14px;left:14px;padding:12px 16px;border-radius:12px;background:#06101de8;border:1px solid #ffffff18;font-weight:900;pointer-events:none}#help{position:fixed;z-index:20;bottom:14px;left:50%;transform:translateX(-50%);padding:10px 15px;border-radius:10px;background:#06101de8;font-size:12px;white-space:nowrap;pointer-events:none}#catch{position:fixed;z-index:30;left:50%;top:72%;transform:translate(-50%,-50%);display:none;width:260px;padding:12px 16px;border:2px solid white;border-radius:12px;background:#000d;font-weight:1000;text-align:center}.meter{height:14px;margin-top:8px;border-radius:9px;background:#26313a;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#45d9ff}.meter b{display:block;margin-top:6px;font-size:11px}.warn{color:#ffd66b}@media(max-width:700px){#help{font-size:9px}}
</style></head><body>
<div id="menu"><div class="card"><div class="k">ROAD TO THE</div><div class="t">LEAGUE<br><span>3D</span></div><div style="color:#9fb0c1;letter-spacing:2px">7v7 • QB / WR • AI DEFENSE • REAL-TIME BALL FLIGHT</div><div class="tap">TAP ANY BUTTON TO CONTINUE</div></div></div>
<div id="hud">YOU: <span id="role">QB</span> • DOWN <span id="down">1</span> • <span id="yards">0</span> YDS • <span id="score">0</span> TD</div>
<div id="help">WASD = RUN • HOLD SHIFT = SPRINT • SPACE = HURDLE • E = THROW • C = CATCH</div><div id="catch">CATCH WINDOW<div class="meter"><i id="meterFill"></i></div><b id="meterText">WAIT</b></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const menu=document.getElementById('menu'),meterFill=document.getElementById('meterFill'),meterText=document.getElementById('meterText'),roleEl=document.getElementById('role'),yardsEl=document.getElementById('yards'),scoreEl=document.getElementById('score'),downEl=document.getElementById('down'),catchEl=document.getElementById('catch');
const keys={};let started=false,scene,camera,renderer,clock,qb,wr,cb1,cb2,ball,pass=null,role='QB',yards=0,td=0,down=1,catchReady=false,sprintEnergy=100,hurdleT=0,runSpeed=0,catchScore=0;

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(!started)start();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);menu.onclick=start;
function start(){if(started)return;started=true;menu.remove();init()}
function M(c,r=.72){return new THREE.MeshStandardMaterial({color:c,roughness:r})}
function mesh(g,m,p=[0,0,0]){const x=new THREE.Mesh(g,m);x.position.set(...p);x.castShadow=true;x.receiveShadow=true;return x}
function human(team,skin=0x8b5a3c){
 const g=new THREE.Group(),dark=M(0x11151b),j=M(team),s=M(skin);
 const torso=mesh(new THREE.CapsuleGeometry(.48,.82,7,12),j,[0,1.5,0]);g.add(torso);
 const neck=mesh(new THREE.CylinderGeometry(.12,.12,.18,10),s,[0,2.0,0]);g.add(neck);
 const head=mesh(new THREE.SphereGeometry(.32,20,16),s,[0,2.43,0]);g.add(head);
 const helmet=mesh(new THREE.SphereGeometry(.39,20,12,0,Math.PI*2,0,Math.PI*.58),j,[0,2.52,0]);g.add(helmet);
 g.add(mesh(new THREE.BoxGeometry(.52,.055,.35),M(0x111820),[0,2.41,-.29]));
 g.add(mesh(new THREE.BoxGeometry(1.25,.24,.68),j,[0,1.9,0]));
 g.userData.parts={arms:[],hands:[],legs:[]};
 for(const side of [-1,1]){
  const arm=mesh(new THREE.CapsuleGeometry(.12,.62,6,9),s,[side*.61,1.5,0]);arm.rotation.z=side*.2;g.add(arm);g.userData.parts.arms.push(arm);
  const hand=new THREE.Group();hand.position.set(side*.7,1.08,0);hand.add(mesh(new THREE.SphereGeometry(.14,12,10),s));
  for(let i=-2;i<=2;i++)hand.add(mesh(new THREE.CapsuleGeometry(.025,.12,4,6),s,[i*.035,-.11,-.02]));
  g.add(hand);g.userData.parts.hands.push(hand);
  const leg=mesh(new THREE.CapsuleGeometry(.16,.8,6,9),dark,[side*.25,.63,0]);g.add(leg);g.userData.parts.legs.push(leg);
  g.add(mesh(new THREE.BoxGeometry(.29,.13,.5),dark,[side*.25,.12,-.09]));
 }
 return g;
}
function animate(g,t,run=false){const p=g.userData.parts;if(!p)return;const a=Math.sin(t*13)*(run?.65:.08);p.legs[0].rotation.x=a;p.legs[1].rotation.x=-a;p.arms[0].rotation.x=-a*.55;p.arms[1].rotation.x=a*.55}
function field(){
 const turf=mesh(new THREE.BoxGeometry(120,.2,53.33),M(0x176b35,1),[0,-.12,0]);scene.add(turf);
 const white=M(0xffffff,1);
 for(let x=-60;x<=60;x+=5)scene.add(mesh(new THREE.BoxGeometry(.07,.025,53),white,[x,.02,0]));
 for(let x=-60;x<=60;x+=10)scene.add(mesh(new THREE.BoxGeometry(.14,.035,53),white,[x,.035,0]));
 for(let z=-26.5;z<=26.5;z+=5)scene.add(mesh(new THREE.BoxGeometry(120,.025,.07),white,[0,.02,z]));
 for(let x=-55;x<=55;x+=5)for(const z of [-5.7,5.7])scene.add(mesh(new THREE.BoxGeometry(.65,.03,.08),white,[x,.04,z]));
 for(const x of [-55,55])scene.add(mesh(new THREE.BoxGeometry(10,.035,53),M(x<0?0x183f80:0x752331),[x,.04,0]));
 for(const x of [-60,60])goal(x);
 // sideline + numbers
 for(const x of [-60,-50,-40,-30,-20,-10,0,10,20,30,40,50,60])label(x===0?'50':String(Math.abs(x)),x,-7.7);
}
function label(text,x,z){const cv=document.createElement('canvas');cv.width=256;cv.height=128;const c=cv.getContext('2d');c.fillStyle='#fff';c.font='bold 72px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText(text,128,64);const tex=new THREE.CanvasTexture(cv);const sp=new THREE.Mesh(new THREE.PlaneGeometry(3.4,1.7),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));sp.rotation.x=-Math.PI/2;sp.position.set(x,.06,z);scene.add(sp)}
function goal(x){const y=M(0xffd34d);scene.add(mesh(new THREE.CylinderGeometry(.09,.09,8,10),y,[x,4,0]));scene.add(mesh(new THREE.BoxGeometry(.18,0.16,8),y,[x,8,0]));scene.add(mesh(new THREE.CylinderGeometry(.09,.09,5,10),y,[x,10,4]));scene.add(mesh(new THREE.CylinderGeometry(.09,.09,5,10),y,[x,10,-4]))}
function stadium(){
 const dark=M(0x18212b),seat=M(0x303944);
 for(const side of [-1,1])for(let r=0;r<5;r++){const b=mesh(new THREE.BoxGeometry(118,1.1,3),seat,[0,r*1.6+1.2,side*(31+r*3)]);scene.add(b)}
 for(const x of [-48,48]){const pole=mesh(new THREE.CylinderGeometry(.16,.16,17,10),dark,[x,8,22]);scene.add(pole);scene.add(mesh(new THREE.BoxGeometry(.2,.2,7),M(0xffffff),[x,16.3,22]))}
}
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x8fb8dc);scene.fog=new THREE.Fog(0x8fb8dc,80,190);
 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xeaf5ff,0x15200f,2.4));const sun=new THREE.DirectionalLight(0xffffff,3.4);sun.position.set(-35,60,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
 field();stadium();
 qb=human(0x1976d2);wr=human(0x1976d2,0x6f4630);cb1=human(0xc6283d);cb2=human(0xc6283d,0x6b4732);
 qb.position.set(-32,0,0);wr.position.set(-5,0,-8);cb1.position.set(-2,0,-5);cb2.position.set(8,0,6);scene.add(qb,wr,cb1,cb2);
 ball=mesh(new THREE.SphereGeometry(.2,20,14),M(0x713e1c),[0,2,0]);ball.scale.set(.8,.8,1.7);scene.add(ball);
 clock=new THREE.Clock();addEventListener('resize',resize);requestAnimationFrame(loop);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function move(p,s){let dx=0,dz=0;if(keys.w||keys.arrowup)dz--;if(keys.s||keys.arrowdown)dz++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(dx||dz){let sprint=keys.shift&&sprintEnergy>1;if(sprint)sprintEnergy=Math.max(0,sprintEnergy-.9);else sprintEnergy=Math.min(100,sprintEnergy+.35);const v=s*(sprint?2.35:1),l=Math.hypot(dx,dz);runSpeed=v;p.position.x+=dx/l*v;p.position.z+=dz/l*v;p.position.x=THREE.MathUtils.clamp(p.position.x,-57,57);p.position.z=THREE.MathUtils.clamp(p.position.z,-23,23);p.rotation.y=Math.atan2(dx,dz);p.userData.running=true}else p.userData.running=false}
function hurdle(p){if(role!=='WR'||hurdleT>0)return;hurdleT=.72;p.userData.hurdling=true} function throwBall(){if(role!=='QB'||pass)return;role='WR';roleEl.textContent='WR';pass={t:0,d:1.25,start:qb.position.clone().add(new THREE.Vector3(0,1.9,0)),target:wr.position.clone().add(new THREE.Vector3(0,1.5,0))};}
function catchBall(){if(role!=='WR'||!pass)return;const d=wr.position.distanceTo(ball.position);if(d<2.8&&pass.t>.42&&pass.t<1.35){pass=null;catchReady=false;catchEl.style.display='none';catchesEl.textContent=++catches;yards+=Math.max(8,Math.round(wr.position.x+32));yardsEl.textContent=yards;role='QB';roleEl.textContent='QB';down++;downEl.textContent=down}}
let catches=0;
function ai(){cb1.position.x+=(wr.position.x+.8-cb1.position.x)*.035;cb1.position.z+=(wr.position.z-cb1.position.z)*.035;cb2.position.x+=(wr.position.x+6-cb2.position.x)*.008;cb2.position.z+=(wr.position.z-cb2.position.z)*.012}
function loop(){const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 if(role==='QB'){move(qb,.11);if(keys.e){keys.e=false;throwBall()}}else{move(wr,.13);if(keys.space){keys.space=false;hurdle(wr)}if(keys.c){keys.c=false;catchBall()}}
 if(!pass)ball.position.copy(role==='QB'?qb.position:wr.position).add(new THREE.Vector3(0,1.9,0));
 if(hurdleT>0){hurdleT-=dt;wr.position.y=Math.sin(Math.PI*(1-hurdleT/.72))*.95;wr.rotation.x=.35}else{wr.position.y=0;wr.rotation.x=0;wr.userData.hurdling=false} if(pass){pass.t+=dt;const p=Math.min(1,pass.t/pass.d),pos=pass.start.clone().lerp(pass.target,p);pos.y+=Math.sin(Math.PI*p)*7;ball.position.copy(pos);const d=wr.position.distanceTo(ball.position);catchReady=d<2.8&&pass.t>.42&&pass.t<1.35;catchEl.style.display=catchReady?'block':'none';if(catchReady){const timing=1-Math.min(1,Math.abs(pass.t-.78)/.36);catchScore=Math.round(timing*100);meterFill.style.width=catchScore+'%';meterText.textContent=catchScore>=85?'PERFECT CATCH':catchScore>=60?'GOOD CATCH':'LATE CATCH'}else{meterFill.style.width='0%';meterText.textContent='GET IN RANGE';}if(p>=1&&!catchReady){pass=null;role='QB';roleEl.textContent='QB';catchEl.style.display='none'}}
 ai();if(runSpeed>.11)animate(qb,t,true);else animate(qb,t,false);if(runSpeed>.11)animate(wr,t,true);else animate(wr,t,false);animate(cb1,t,true);animate(cb2,t,true);
 const target=role==='WR'?wr:qb;camera.position.lerp(new THREE.Vector3(target.position.x+8,5.4,target.position.z+11),.09);camera.lookAt(target.position.x+3,1.4,target.position.z);renderer.render(scene,camera);requestAnimationFrame(loop)}
</script></body></html>
