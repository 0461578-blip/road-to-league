<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to the League</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110a;font-family:Arial,sans-serif;color:white}canvas{display:block;width:100%;height:100%}#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#12314a,#020509 75%);text-align:center;cursor:pointer}#card{padding:45px 30px;border:1px solid #ffffff22;border-radius:24px;background:#07111fee;box-shadow:0 20px 80px #000}#k{letter-spacing:6px;color:#45d9ff;font-weight:900}h1{font-size:clamp(50px,10vw,100px);line-height:.85;margin:12px 0}h1 span{color:#45d9ff}.tap{display:inline-block;padding:16px 25px;border:2px solid #45d9ff;border-radius:12px;color:#45d9ff;font-weight:900;letter-spacing:2px;animation:p 1.2s infinite}@keyframes p{50%{transform:scale(1.04)}}#hud{position:fixed;top:15px;left:15px;z-index:3;background:#07111ddd;padding:12px 16px;border-radius:12px;font-weight:900}#help{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:3;background:#07111ddd;padding:10px 15px;border-radius:10px;font-size:12px;white-space:nowrap}@media(max-width:600px){#help{font-size:10px}} </style></head><body><canvas id="game"></canvas><div id="hud">ROAD TO THE LEAGUE • <span id="yards">0</span> YDS</div><div id="help">WASD / ARROWS MOVE • SHIFT SPRINT • E THROW • C CATCH</div><div id="menu"><div id="card"><div id="k">ROAD TO THE</div><h1>LEAGUE<br><span>FOOTBALL</span></h1><div class="tap">TAP ANY BUTTON TO CONTINUE</div><p style="color:#8ea4b8">8-BIT FIELD EDITION</p></div></div><script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),menu=document.getElementById('menu'),yd=document.getElementById('yards');let W,H,started=false;const k={};let px=.18,py=.5,ballX=.21,ballY=.5,yards=0,throwing=0;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function start(){if(started)return;started=true;menu.remove()}menu.addEventListener('click',start);addEventListener('keydown',e=>{k[e.key.toLowerCase()]=true;if(!started)start();if(e.key.toLowerCase()==='e')throwing=1;if(e.key.toLowerCase()==='c'&&throwing){yards+=10+Math.floor(Math.random()*20);throwing=0;yd.textContent=yards}});addEventListener('keyup',e=>k[e.key.toLowerCase()]=false);
function player(x,y,c,label){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.fillText(label,x-14,y+4)}
function loop(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#14652f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;for(let i=0;i<=20;i++){let x=i*W/20;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let i=0;i<=10;i++){let y=i*H/10;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#173d80';ctx.fillRect(0,0,W*.07,H);ctx.fillRect(W*.93,0,W*.07,H);
if(started){let s=k.shift?.009:.005;if(k.w||k.arrowup)py-=s;if(k.s||k.arrowdown)py+=s;if(k.a||k.arrowleft)px-=s;if(k.d||k.arrowright)px+=s;px=Math.max(.08,Math.min(.92,px));py=Math.max(.08,Math.min(.92,py));ballX=px+.035;ballY=py-.015;if(throwing){ballX+=.15;ctx.fillStyle='#7b431f';ctx.beginPath();ctx.ellipse(ballX*W,ballY*H,11,7,0,0,Math.PI*2);ctx.fill()}player(px*W,py*H,'#25b8ed','YOU');player(.52*W,.40*H,'#ef5265','DB');player(.70*W,.60*H,'#ef5265','DB');ctx.fillStyle='#fff';ctx.font='900 16px Arial';ctx.fillText('END ZONE',W*.925,H*.5)}requestAnimationFrame(loop)}loop();
</script></body></html>
