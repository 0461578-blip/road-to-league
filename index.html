<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road to the League — Football</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#061009;font-family:Arial,Helvetica,sans-serif;color:#fff}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#020603f5,#07130be8),radial-gradient(circle at 70% 40%,#244b2c66,transparent 45%)}
.card{width:min(920px,92vw);padding:42px;border:1px solid #ffffff24;border-radius:22px;background:#08130df2;box-shadow:0 30px 100px #000;text-align:left}
.logo{font-size:clamp(46px,8vw,88px);font-weight:1000;line-height:.82;letter-spacing:-4px}.logo b{color:#37e77c}.tag{color:#aebdb2;letter-spacing:2px;font-weight:800;margin:20px 0 30px}
button{border:0;border-radius:10px;padding:16px 26px;background:#37e77c;color:#031007;font-weight:1000;font-size:18px;cursor:pointer;margin-right:10px}button.alt{background:#16231a;color:#fff;border:1px solid #ffffff20}
.small{color:#8ea193;font-size:13px;margin-top:24px}
#hud,#score,#playbar,#career,#controls,#catch,#toast{position:fixed;z-index:20;background:#06100ce8;border:1px solid #ffffff1c;box-shadow:0 8px 30px #0008;border-radius:12px}
#hud{top:12px;left:12px;padding:10px 14px;font-weight:900}#score{top:12px;right:12px;padding:10px 16px;text-align:center;font-weight:900}
#playbar{top:72px;left:50%;transform:translateX(-50%);padding:9px 16px;font-weight:1000}
#career{top:100px;right:12px;padding:12px 14px;width:190px;display:none}.meter{height:7px;background:#1b2920;border-radius:8px;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:#37e77c}
#controls{bottom:12px;left:50%;transform:translateX(-50%);padding:9px 14px;font-size:12px;white-space:nowrap}
#catch{left:50%;top:76%;transform:translate(-50%,-50%);width:320px;display:none;padding:12px;text-align:center;font-weight:1000;border:2px solid #37e77c}
#catch .bar{height:14px;background:#17251b;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:#37e77c}
#toast{left:50%;top:18%;transform:translateX(-50%);padding:12px 18px;font-weight:1000;display:none}
@media(max-width:700px){#controls{font-size:10px;max-width:94vw;white-space:normal;text-align:center}.card{padding:28px}.logo{letter-spacing:-2px}}
</style>
</head>
<body>
<div id="menu"><div class="card">
<div class="logo">ROAD TO<br><b>THE LEAGUE</b></div>
<div class="tag">BUILD YOUR PLAYER • RUN YOUR ROUTES • EARN YOUR SPOT</div>
<button id="play">PLAY GAME</button><button class="alt" id="careerBtn">ROAD TO GLORY</button>
<div class="small">WASD move • SHIFT sprint • E throw • C catch • Q switch to WR • SPACE snap • 1–4 play calls • R reset play</div>
</div></div>
<div id="hud"></div><div id="score"></div><div id="playbar"></div><div id="career"></div><div id="catch"><div>PRESS C TO CATCH</div><div class="bar"><i></i></div></div><div id="controls">WASD MOVE &nbsp; SHIFT SPRINT &nbsp; SPACE SNAP &nbsp; E THROW &nbsp; C CATCH &nbsp; Q SWITCH WR &nbsp; 1–4 PLAYS &nbsp; R RESET</div><div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x08120d);
scene.fog=new THREE.Fog(0x08120d,65,230);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcfe4ff,0x1a281d,2.2));
const sun=new THREE.DirectionalLight(0xffffff,3.2);sun.position.set(-35,55,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;scene.add(sun);
const mat=(c,r=.65)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const box=(s,p,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(...s),m);o.position.set(...p);o.castShadow=o.receiveShadow=true;scene.add(o);return o};
const cyl=(r,h,p,m)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),m);o.position.set(...p);o.castShadow=true;scene.add(o);return o};
const green=mat(0x126b36),white=mat(0xf1f3f0),dark=mat(0x18201b),blue=mat(0x2368d1),red=mat(0xc82f45),black=mat(0x090d0b),brown=mat(0x6e3a1b),skin=mat(0x8b5b3c);
box([120,.3,52],[0,-.15,0],green);
for(let x=-60;x<=60;x+=5)box([.06,.035,52],[x,.04,0],white);
for(let x=-60;x<=60;x+=10)box([.13,.04,52],[x,.06,0],white);
for(let x=-55;x<=55;x+=5)for(const z of [-3.2,3.2])box([.06,.04,.7],[x,.07,z],white);
box([10,.04,52],[-55,.07,0],mat(0x234f9b));box([10,.04,52],[55,.07,0],mat(0x7b2940));
for(let x=-50;x<=50;x+=10){for(const z of [-7,7]){const t=document.createElement('canvas');t.width=128;t.height=64;const q=t.getContext('2d');q.fillStyle='white';q.font='bold 48px Arial';q.textAlign='center';q.fillText(String(Math.abs(x)||50),64,48);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(t),transparent:true,opacity:.8}));sp.position.set(x,.08,z);sp.scale.set(4,2,1);scene.add(sp)}} 
for(const z of [-31,31])for(let r=0;r<7;r++)box([122,1.2,2.2],[0,1.2+r*1.3,z+(z>0?r*1.5:-r*1.5)],mat(0x262d31));
for(const x of [-48,-24,0,24,48]){cyl(.2,15,[x,7.5,-30],mat(0x555b61));cyl(.2,15,[x,7.5,30],mat(0x555b61));box([1.5,.8,.4],[x,15.5,-30],white);box([1.5,.8,.4],[x,15.5,30],white)}
function player(team,num){const g=new THREE.Group();scene.add(g);g.userData={team,num,baseY:0,v: new THREE.Vector3()};const tm=team===blue?blue:red;
const torso=new THREE.Mesh(new THREE.BoxGeometry(1.05,.9,.65),tm);torso.position.y=1.35;torso.castShadow=true;g.add(torso);
const pad=new THREE.Mesh(new THREE.BoxGeometry(1.3,.28,.82),mat(team===blue?0x174c9a:0x8d2232));pad.position.y=1.72;pad.castShadow=true;g.add(pad);
for(const s of [-1,1]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.32,.85,.36),black);leg.position.set(s*.25,.45,0);leg.castShadow=true;g.add(leg);const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.5,6,10),tm);arm.position.set(s*.65,1.25,0);arm.rotation.z=s*.18;g.add(arm);const hand=new THREE.Mesh(new THREE.SphereGeometry(.14,12,8),skin);hand.position.set(s*.72,.88,0);g.add(hand)}
const h=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),skin);h.position.y=2.25;h.castShadow=true;g.add(h);
const hel=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12,0,Math.PI*2,0,Math.PI*.62),tm);hel.position.y=2.45;g.add(hel);
const mask=boxLocal(new THREE.BoxGeometry(.68,.07,.08),black);mask.position.set(0,2.3,-.39);g.add(mask);
const n=new THREE.Sprite(new THREE.SpriteMaterial({map:numberTexture(num),transparent:true}));n.position.set(0,1.35,-.36);n.scale.set(.6,.6,1);g.add(n);return g}
function boxLocal(geo,m){const o=new THREE.Mesh(geo,m);o.castShadow=true;return o}
function numberTexture(n){const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');x.fillStyle='white';x.font='bold 88px Arial';x.textAlign='center';x.fillText(n,64,92);return new THREE.CanvasTexture(c)}
const qb=player(blue,'12'),wr=player(blue,'11');qb.position.set(-25,0,0);wr.position.set(-25,0,-9);
const teammates=[];for(let i=-2;i<=2;i++){const p=player(blue,'6'+(i+2));p.position.set(-27,0,i*2);teammates.push(p)}
const rb=player(blue,'22');rb.position.set(-27,0,5);
for(const z of [-6,-2,2,6]){const p=player(red,'90');p.position.set(-22,0,z);teammates.push(p)}
for(const z of [-8,0,8]){const p=player(red,'52');p.position.set(-17,0,z);teammates.push(p)}
for(const z of [-10,10]){const p=player(red,'21');p.position.set(-16,0,z);teammates.push(p)}
const ball=new THREE.Mesh(new THREE.SphereGeometry(.2,16,10),mat(0x6d391a));ball.scale.z=1.7;scene.add(ball);
let user=qb,role='QB',live=false,ballAir=false,ballT=0,ballStart=new THREE.Vector3(),ballTarget=new THREE.Vector3(),down=1,dist=10,scoreH=0,scoreA=0,clock=720,stamina=100,play='SLANT',catchOpen=false,careerXP=0,rep=0;
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')snap();if(e.code==='KeyE'&&role==='QB')throwBall();if(e.code==='KeyC'&&role==='WR')catchBall();if(e.code==='KeyQ'&&!ballAir)switchWR();if(e.code==='KeyR')reset();if(/^Digit[1-4]$/.test(e.code)){play=['SLANT','GO','OUT','CURL'][+e.code.slice(5)-1];toast(play+' PLAY SELECTED')}});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',1000)}
function snap(){if(!live){live=true;toast('PLAY LIVE');}}
function switchWR(){role='WR';user=wr;toast('WR CONTROL');}
function reset(){live=false;ballAir=false;role='QB';user=qb;qb.position.set(-25,0,0);wr.position.set(-25,0,-9);ball.position.copy(qb.position).add(new THREE.Vector3(0,1.55,0));catchOpen=false;document.querySelector('#catch').style.display='none'}
function throwBall(){if(ballAir)return;ballAir=true;ballT=0;ballStart.copy(qb.position).add(new THREE.Vector3(0,2,0));let target=wr.position.clone();if(play==='GO')target.x+=16;if(play==='OUT')target.z-=4;if(play==='CURL')target.x+=5;target.y+=1.4;ballTarget.copy(target);toast('PASS IN THE AIR')}
function catchBall(){if(!ballAir||!catchOpen)return;const d=user.position.distanceTo(ball.position);if(d<3){ballAir=false;careerXP+=12;rep+=1;toast('PERFECT CATCH +12 XP');const gained=Math.max(0,Math.round(user.position.x+25));if(gained>=dist){down=1;dist=10}else{dist=Math.max(1,dist-gained);down++}if(user.position.x>53){scoreH+=7;toast('TOUCHDOWN +7');}reset()}}
function updatePlayer(dt){const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);const len=Math.hypot(f,s)||1;const sprint=keys.ShiftLeft||keys.ShiftRight;const sp=sprint&&stamina>0?9:5.5;if(sprint&&f||sprint&&s)stamina=Math.max(0,stamina-dt*25);else stamina=Math.min(100,stamina+dt*18);if(f||s){user.position.x+=f/len*sp*dt;user.position.z+=s/len*sp*dt;user.position.x=Math.max(-58,Math.min(58,user.position.x));user.position.z=Math.max(-23,Math.min(23,user.position.z));user.rotation.y=Math.atan2(s,f)}}
function routes(dt){if(!live||role==='WR')return;let target=wr.position.clone();if(play==='GO')target.x+=25;else if(play==='OUT'){target.x+=7;target.z-=6}else if(play==='CURL'){target.x+=8}else{target.x+=13;target.z+=7}const v=target.sub(wr.position);v.y=0;if(v.length()>1)wr.position.add(v.normalize().multiplyScalar(5.8*dt))}
function defense(dt){if(!live)return;for(const p of teammates){if(p.userData.team!==red)continue;const target=role==='WR'?user:qb;const v=target.position.clone().sub(p.position);v.y=0;if(v.length()>1.2)p.position.add(v.normalize().multiplyScalar(4.1*dt));if(role==='WR'&&p.position.distanceTo(user.position)<1.25&&!ballAir){down++;toast('TACKLED');reset()}}}
function pass(dt){if(!ballAir){ball.position.copy(qb.position).add(new THREE.Vector3(0,1.55,0));return}ballT+=dt;const t=Math.min(1,ballT/1.0);ball.position.lerpVectors(ballStart,ballTarget,t);ball.position.y+=Math.sin(Math.PI*t)*5.2;catchOpen=t>.45&&t<.96;if(catchOpen&&role==='WR'){const c=document.querySelector('#catch');c.style.display='block';c.querySelector('i').style.width=(100-Math.abs(.72-t)*260)+'%'}else document.querySelector('#catch').style.display='none';if(t>=1&&!catchOpen){ballAir=false;reset()}}
function cam(dt){const target=user.position.clone();const desired=target.clone().add(new THREE.Vector3(-10,6.3,15));camera.position.lerp(desired,1-Math.pow(.0008,dt));camera.lookAt(target.x+5,1.2,target.z)}
function hud(){const m=Math.floor(clock/60),s=Math.floor(clock%60);document.querySelector('#hud').textContent='YOU: '+role+'  •  '+play+'  •  STAMINA '+Math.round(stamina);document.querySelector('#score').innerHTML='HOME '+scoreH+' — '+scoreA+' AWAY<br><small>'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'</small>';document.querySelector('#playbar').textContent='DOWN '+down+' & '+dist+'   •   '+play;const c=document.querySelector('#career');c.style.display=live?'block':'none';c.innerHTML='<b>ROAD TO GLORY</b><br>REP '+rep+'<div class="meter"><i style="width:'+Math.min(100,careerXP/2)+'%"></i></div>XP '+careerXP+'<br><small>PROSPECT • LEVEL '+(1+Math.floor(careerXP/50))+'</small>'}
document.querySelector('#play').onclick=()=>{document.querySelector('#menu').style.display='none';reset()};document.querySelector('#careerBtn').onclick=()=>{document.querySelector('#menu').style.display='none';reset();toast('ROAD TO GLORY STARTED')};
let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(document.querySelector('#menu').style.display==='none'){clock=Math.max(0,clock-dt);updatePlayer(dt);routes(dt);defense(dt);pass(dt);cam(dt);hud()}else{camera.position.lerp(new THREE.Vector3(-45,16,32),.02);camera.lookAt(-15,1,0)}renderer.render(scene,camera);requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script>
</body></html>
